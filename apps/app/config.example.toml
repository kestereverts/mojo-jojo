# mojo-jojo bot — annotated configuration template. Copy to config.toml and edit.
#
# SECRETS NEVER GO IN THIS FILE. The server password and SASL password come from the
# environment and override anything here:
#   IRC_PASSWORD, IRC_SASL_USER, IRC_SASL_PASS
# Other handy env overrides: IRC_HOST, IRC_PORT, IRC_NICK, IRC_TLS (0/1),
# IRC_TLS_INSECURE (1), BOT_PREFIX, BOT_OWNERS (comma-separated), BOT_CONFIG (path).
#
# NOTE: top-level keys (like `externalModules`) MUST appear before any [table] section.

# External modules: relative paths (resolved against THIS file's directory) or package
# specifiers. Listing one registers AND enables it; its [modules.<name>] table (if any)
# supplies options. Each is dynamically imported and runs with full process privilege —
# treat this config file as trusted as the bot's own code.
# The AI brain ships as a workspace package; Bun's isolated node_modules keep bare
# specifiers from resolving inside @mojo-jojo/bot's dynamic import, so use a path.
externalModules = ["../../packages/ai/src/mojo-ai.ts"]

[server]
host = "irc.example.org"
port = 6697            # default 6697 with TLS, 6667 without
tls = true             # or false; or a [server.tls] table with rejectUnauthorized
nick = "mojo-jojo"
username = "mojo"      # defaults to nick
realName = "Mojo Jojo" # defaults to nick
altNicks = ["mojo-jojo_", "mojo-jojo__"]
caps = "default"       # "default" (curated set), "all", or an explicit list
# password = "..."     # prefer IRC_PASSWORD

# [server.sasl]        # prefer IRC_SASL_USER / IRC_SASL_PASS for the password
# mechanism = "PLAIN"
# username = "mojo"

[server.reconnect]
enabled = true
initialDelayMs = 1000
maxDelayMs = 30000

[bot]
prefix = "!"
# Owner matchers. Prefer `account:<name>` (services-authenticated) or `mask:<nick!user@host>`.
# A bare nick / `nick:<nick>` is INSECURE — an attacker who takes the nick while the owner is
# offline gains owner access (the bot logs a warning for these). Identity ultimately comes from
# the IRC server, which is trusted: a malicious/compromised server can impersonate anyone.
owners = ["account:you"]
ignore = [] # same matcher forms; matched senders are dropped before dispatch
allowPrefixlessInPm = true
failOnModuleError = false # true = a module that fails to load aborts startup
logLevel = "info"         # debug | info | warn | error | silent
# Per-sender command rate limit (token bucket): a burst of `commandBurst`, refilling one
# command every `commandRefillMs`. Bounds how fast one user can drive the bot's output.
commandBurst = 5
commandRefillMs = 1000 # set to 0 to disable the rate limit entirely

# A [modules.<name>] table enables and configures a module (presence = enabled).
[modules.ping]
[modules.help]

[modules.admin]
allowRaw = false # gate the powerful owner-only !raw command (off by default)

[modules.ctcp]
version = "mojo-jojo"

[modules.autojoin]
channels = ["#mojo2"]
# delayMs = 0
# [modules.autojoin.keys]
# "#secret" = "hunter2"

# The LLM chat brain (@mojo-jojo/ai). Providers: google (GEMINI_API_KEY) and
# openai (OPENAI_API_KEY). Keys come from env, never this file.
[modules.mojo-ai]
# model = "openai/gpt-5.4-mini" # legacy alias for [modules.mojo-ai.models] chat=
# historyLimit = 200 # per-conversation memory window (context events)
# maxSteps = 8       # tool-loop iterations per exchange
# replyLines = 3     # max IRC lines per reply
# friendsFile = "./friends.toml" # real-person data (gitignored); see friends.example.toml

# Model per occasion, each "provider/model-id"; unset roles default to `chat`
# (embedding defaults to openai/text-embedding-3-small instead). classifier/
# embedding are consumed by guards (M7); summarizer by compaction (M8);
# research by subagents (M6) — validated/resolvable now, not yet consumed.
[modules.mojo-ai.models]
chat = "openai/gpt-5.4-mini"
# classifier = "openai/gpt-5.4-mini"
# summarizer = "openai/gpt-5.4-mini"
# research = "openai/gpt-5.4-mini"
# embedding = "openai/text-embedding-3-small"

# Relay/bridge bots to unwrap (Telegram/Discord, etc). Each pattern MUST have
# named groups (?<author>...) and (?<text>...); matched against a copy of the
# line with mIRC formatting codes stripped (Discord color-wraps the author).
# A relay sender whose line doesn't match falls through unchanged (safe
# degrade — treated as the relay bot's own words).
# [[modules.mojo-ai.relays]]
# nick = "Telegram"
# pattern = '^(?<author>.+?): (?<text>.*)$'
#
# [[modules.mojo-ai.relays]]
# nick = "Discord"
# pattern = '^<(?<author>.+?)> (?<text>.*)$'

# Built-in tools: letter_count, local_time, currency_convert, weather_forecast,
# wolfram_alpha (research_topic/web_search/paste/places_search land M5-M6).
# A disabled tool disappears entirely: no entry, no guidance, never durable.
[modules.mojo-ai.tools]
disabled = []
